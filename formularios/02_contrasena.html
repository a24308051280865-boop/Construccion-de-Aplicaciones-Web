<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formulario para contraseñas</title>
</head>
<body>

<h2>Formulario para contraseñas</h2>

<!-- Formulario que envía los datos por POST -->
<form action="" method="post">
  Ingresa tu usuario:
  <!-- Campo de texto normal: el usuario se ve mientras se escribe -->
  <input type="text" name="usuario">

  Ingresa tu contraseña:
  <!-- type="password": oculta los caracteres escritos con puntos o asteriscos -->
  <input type="password" name="pass">
  <br>
  <!-- Botón para enviar los datos -->
  <input type="submit" value="enviar">
  <!-- type="reset": limpia todos los campos del formulario -->
  <input type="reset" value="borrar">
</form>

</body>
</html>
