<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formulario con botones</title>
<!-- Librería de iconos en línea (Font Awesome) para los iconos de los botones -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/fontawesome/7.3.1/css/all.min.css">
</head>
<body>

<h2>Formulario con botones</h2>

<form action="" method="post">
  Ingresa tu nombre:
  <input type="text" name="nombre">
  <br>
  <!-- button: botón con etiqueta de apertura y cierre; puede contener texto e iconos.
       type="submit": envía el formulario.
       La etiqueta i con clase fa-... muestra un icono de Font Awesome. -->
  <button type="submit">Enviar <i class="fa-regular fa-paper-plane"></i> </button>
  <!-- type="reset": borra el contenido de los campos -->
  <button type="reset">Borrar <i class="fa fa-trash"></i></button>
</form>

</body>
</html>
