<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formulario con archivos</title>
<!-- Librería de iconos en línea (Font Awesome) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/fontawesome/7.3.1/css/all.min.css">
</head>
<body>

<h2>Formulario con archivos</h2>

<!-- NOTA: para que el servidor reciba realmente el archivo, el formulario
     debe llevar enctype="multipart/form-data" (el PDF original no lo incluye). -->
<form action="" method="post" enctype="multipart/form-data">
  Ingresa tu nombre:
  <input type="text" name="nombre">
  <br>
  <!-- type="file": muestra un botón para seleccionar un archivo del equipo -->
  <input type="file" name="archivo">
  <br>
  <button type="submit">Enviar <i class="fa-regular fa-paper-plane"></i> </button>
  <button type="reset">Borrar <i class="fa fa-trash"></i></button>
</form>

</body>
</html>
