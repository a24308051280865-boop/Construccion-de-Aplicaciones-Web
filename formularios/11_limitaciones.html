<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formulario con limitaciones</title>
</head>
<body>

<h2>Formulario con limitaciones</h2>

<form action="" method="post">
  Ingresa tu nombre:
  <!-- Deshabilitación de campo:
       disabled impide escribir en el campo y su valor NO se envía al servidor -->
  <input type="text" name="nombre" disabled><br>

  <!-- Limitación de caracteres:
       maxlength="5" solo permite escribir hasta 5 caracteres -->
  Contraseña:
  <input type="password" name="pass" maxlength="5"><br>

  <!-- Solo lectura:
       readonly muestra el texto pero no se puede modificar (a diferencia de disabled, sí se envía) -->
  Comentarios:
  <textarea name="comentarios" readonly>Este es mi comentario y no se puede borrar
</textarea><br>
</form>

</body>
</html>
