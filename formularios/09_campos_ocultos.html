<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formulario con campos ocultos</title>
<!-- Librería de iconos en línea (Font Awesome) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/fontawesome/7.3.1/css/all.min.css">
</head>
<body>

<h2>Formulario con campos ocultos</h2>

<form action="" method="post">
  <!-- type="hidden": campo que NO se ve en pantalla, pero sí se envía al servidor.
       Sirve para mandar datos fijos (hora, identificadores, etc.) -->
  <input type="hidden" name="hora" value="3:30">
  Ingresa tu nombre:
  <input type="text" name="nombre">
  <br>
  <button type="submit">Enviar <i class="fa-regular fa-paper-plane"></i> </button>
  <button type="reset">Borrar <i class="fa fa-trash"></i></button>
</form>

</body>
</html>
