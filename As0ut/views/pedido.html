<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Finalizar compra · As0ut</title>
  <link rel="stylesheet" href="../styles/main.css">
</head>
<body>
  <header class="site-header" id="site-header"></header>

  <section class="page-head">
    <div class="wrap">
      <p class="eyebrow">Último paso</p>
      <h1>Finalizar compra</h1>
    </div>
  </section>

  <main class="wrap">
    <div class="split">
      <form id="pedido" class="panel" novalidate>
        <h3>Datos de contacto</h3>
        <div class="two">
          <label>Nombre de quien recibe <input name="nombre_receptor" autocomplete="name"></label>
          <label>Teléfono (10 dígitos) <input type="tel" name="telefono" autocomplete="tel"></label>
        </div>

        <h3>Dirección de entrega</h3>
        <label>Calle y número <input name="calle" autocomplete="street-address"></label>
        <div class="two">
          <label>Colonia <input name="colonia"></label>
          <label>Código postal <input name="codigo_postal" maxlength="5" inputmode="numeric" autocomplete="postal-code"></label>
        </div>
        <div class="two">
          <label>Ciudad <input name="ciudad"></label>
          <label>Estado <input name="estado"></label>
        </div>
        <label>Referencias (opcional)
          <textarea name="referencias" rows="2" maxlength="200" placeholder="Entre calles, color de la casa, etc."></textarea>
        </label>

        <h3>Método de pago</h3>
        <label>Forma de pago
          <select name="metodo_pago">
            <option>Efectivo contra entrega</option>
            <option>Transferencia bancaria</option>
            <option>Tarjeta al recibir</option>
          </select>
        </label>

        <button class="btn block" id="submit" type="submit">Confirmar pedido</button>
        <p id="msg" class="msg" role="alert"></p>
      </form>

      <aside class="summary">
        <h3>Tu pedido</h3>
        <div id="items"></div>
        <div class="row total"><span>Total</span><span id="total"></span></div>
        <a class="link-btn" href="carrito.html">← Volver al carrito</a>
      </aside>
    </div>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="../scripts/imagenes.js"></script>
  <script src="../scripts/common.js"></script>
  <script src="../scripts/pedido.js"></script>
</body>
</html>
