<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catálogo · As0ut</title>
  <link rel="stylesheet" href="../styles/main.css">
</head>
<body>
  <header class="site-header" id="site-header"></header>

  <section class="page-head">
    <div class="wrap">
      <p class="eyebrow">Catálogo</p>
      <h1 id="cat-title">&nbsp;</h1>
      <p class="lead" id="cat-desc"></p>
    </div>
  </section>

  <main class="wrap">
    <div class="toolbar">
      <div class="chips" id="chips"></div>
      <div class="tools-row">
        <input type="search" id="search" placeholder="Buscar prenda o marca">
        <select id="sort">
          <option value="">Ordenar: nombre</option>
          <option value="asc">Precio: menor a mayor</option>
          <option value="desc">Precio: mayor a menor</option>
        </select>
      </div>
    </div>
    <p class="count-text" id="count"></p>
    <div class="grid" id="grid"><p class="muted">Cargando...</p></div>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="../scripts/imagenes.js"></script>
  <script src="../scripts/common.js"></script>
  <script src="../scripts/categoria.js"></script>
</body>
</html>
