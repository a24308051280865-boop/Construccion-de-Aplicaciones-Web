<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Codificacion de caracteres -->
    <meta charset="UTF-8">
    <!-- Hace que la pagina se adapte al ancho de la pantalla -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Titulo que aparece en la pestana del navegador -->
    <title>Encabezados HTML</title>
</head>

<body>

    <!-- Los encabezados van del h1 (mas grande) al h6 (mas pequeno) -->
    <h1>Titulo 1</h1>
    <h2>Titulo 2</h2>
    <h3>Titulo 3</h3>
    <h4>Titulo 4</h4>
    <h5>Titulo 5</h5>
    <h6>Titulo 6</h6>
</body>

</html>
