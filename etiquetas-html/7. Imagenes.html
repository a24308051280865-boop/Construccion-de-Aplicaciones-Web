<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagenes en HTML</title>
</head>
<body>
    <h2>Imagenes en HTML</h2>

    <!-- Imagen local: el archivo esta en la misma carpeta que el HTML -->
    <h3>Locales</h3>
    <!-- alt: texto alternativo que se muestra si la imagen no carga -->
    <img src="caritas.png" alt="Imagen de carita feliz">

    <!-- Imagen local ubicada dentro de la carpeta "imagenes", con tamaño modificado -->
    <h3>Locales redismensionado</h3>
    <!-- width y height: ancho y alto en pixeles -->
    <img src="imagenes/carita.png" alt="" width="200" height="100">

    <!-- Imagen tomada de internet mediante su URL -->
    <h3>Desde internet</h3>
    <img src="https://st2.depositphotos.com/2172759/11751/v/950/depositphotos_117511772-stock-illustration-happy-face-isolated-on-white.jpg"
    width="200" height="200"
    alt="">

    <!-- Un GIF animado se inserta igual que una imagen normal -->
    <h3>Animaciones</h3>
    <img
src="https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExejMydmVybzBiY3lkdWdlNnplMzJiMXA3Ymt3czE3NGplNDZuZDg5YiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/tXL4FHPSnVJ0A/giphy.gif"
    width="200" height="200"
    alt="">
</body>
</html>
