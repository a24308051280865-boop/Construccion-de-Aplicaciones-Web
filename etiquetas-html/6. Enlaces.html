<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enlaces en HTML</title>
</head>
<body>
    <h2>Tipos de enlaces en HTML</h2>
    <p><strong>Enlaces/Hipervinculos a otra pagina del
            mismo sitio.
        </strong></p>
    <!-- Sin target: se abre en la misma pestana (comportamiento por defecto) -->
    <a href="1. Hola_mundo.html">1. Hola Mundo</a><br>
    <!-- _self: se abre en la misma pestana o ventana -->
    <a href="2. Encabezados.html" target="_self">
        2. Encabezados</a><br>
    <!-- _blank: se abre en una nueva pestana -->
    <a href="3. Parrafos.html" target="_blank">
        3. Parrafos</a><br>
    <!-- _parent: se abre en el marco padre (frame contenedor) -->
    <a href="4. Salto de linea.html" target="_parent">
        4. Salto de linea</a><br>
    <!-- _top: se abre ocupando toda la ventana, fuera de cualquier marco -->
    <a href="5. Enfatizado.html" target="_top">
        5. Enfatizado</a><br>
    <p><strong>Enlaces/Hipervinculos a sitios externos
        </strong></p>
    <!-- Enlaces a sitios externos usando la URL completa -->
    <a href="https://www.google.com/">Google</a><br>
    <a href="https://www.youtube.com/" target="_self">
        YouTube</a><br>
    <a href="https://www.facebook.com/" target="_blank">
        FaceBook</a><br>
    <a href="https://www.wikipedia.com/" target="_parent">
        WikiPedia</a><br>
    <a href="https://www.espanol.yahoo.com/" target="_top">
        Yahoo!</a><br>
</body>
</html>
