<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Levis - Registro</title>
    <link rel="stylesheet" href="../styles/register.css">
</head>
<body>

    <div class="caja">
        <h1>LEVIS</h1>
        <h2>Crear cuenta</h2>

        <form action="../api/register.php" method="post">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" required>

            <label for="correo">Correo:</label>
            <input type="email" id="correo" name="correo" required>

            <label for="password">Contraseña (mínimo 4 caracteres):</label>
            <input type="password" id="password" name="password" minlength="4" required>

            <label for="confirmar">Confirmar contraseña:</label>
            <input type="password" id="confirmar" name="confirmar" minlength="4" required>

            <button type="submit">Registrarme</button>
        </form>

        <p>¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
    </div>

</body>
</html>
